[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dkbg-parser"
version = "0.1.0"
description = "Style-preserving Word and text-PDF parser framework"
requires-python = ">=3.10"
dependencies = ["pythonnet>=3.0,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
opendataloader = ["opendataloader-pdf"]
image = ["PyMuPDF>=1.24,<2"]
ocr = [
    "PyMuPDF>=1.24,<2",
    "numpy>=1.26,<2",
    "opencv-python>=4.8,<4.12",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.17,<2",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["parser_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
